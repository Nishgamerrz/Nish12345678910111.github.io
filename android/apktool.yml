# apktool project metadata for Relay Dashboard.
apkFileName: RelayDashboard.apk
compressionType: false
doNotCompress:
- png
- arsc
- so
isFrameworkApk: false
packageInfo: null
# NOTE: minSdkVersion here (not in AndroidManifest.xml, which stays 24) is what
# apktool passes to smali, and it decides the .dex format:
#   23 -> dex 035   24..25 -> dex 037
# We deliberately emit dex 035: it is the format every Android 7.0/7.1 build
# (including OEM ones with picky ART) accepts unconditionally, and this app
# uses no Java 8 default-interface tricks that would need 037.
sdkInfo:
  minSdkVersion: '23'
  targetSdkVersion: '28'
sharedLibrary: false
sparseResources: false
usesFramework:
  ids:
  - 1
  tag: null
version: 2.9.3
versionInfo:
  versionCode: '4'
  versionName: '2.1'
